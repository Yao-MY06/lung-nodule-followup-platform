server:
  port: 8084

spring:
  application:
    name: yiliao-followup
  datasource:
    url: jdbc:mysql://localhost:3306/yiliao_followup?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: yiliao123
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    compatibility-verifier:
      enabled: false   # SC 2023.0.3 校验器不认 Boot 3.4.5（SCA 矩阵允许），见 AGENTS.md 已知陷阱
    nacos:
      discovery:
        enabled: false
        server-addr: localhost:8848

yiliao:
  xxl-job:
    enabled: false          # 联调时开启：admin-addresses: http://localhost:8280/xxl-job-admin
    admin-addresses: http://localhost:8280/xxl-job-admin
    appname: yiliao-followup

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

knife4j:
  enable: true

logging:
  level:
    com.yiliao: INFO


# rocketmq 是根级属性（不是 spring.rocketmq）——缩进错误曾导致自动装配失效，见 AGENTS.md 陷阱
rocketmq:
  name-server: localhost:9876
  producer:
    group: yiliao-followup-producer
    send-message-timeout: 5000