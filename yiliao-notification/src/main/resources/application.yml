server:
  port: 8085

spring:
  application:
    name: yiliao-notification
  datasource:
    url: jdbc:mysql://localhost:3306/yiliao_notify?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: yiliao123
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
  rocketmq:
    name-server: localhost:9876
  cloud:
    nacos:
      discovery:
        enabled: false
        server-addr: localhost:8848

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

yiliao:
  notify:
    sms-enabled: false   # 短信渠道开关：关闭时仅发站内信（厂商对接后开启）

knife4j:
  enable: true

logging:
  level:
    com.yiliao: INFO
