server:
  port: 8083

spring:
  application:
    name: yiliao-nodule
  datasource:
    url: jdbc:mysql://localhost:3306/yiliao_nodule?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: yiliao123
    driver-class-name: com.mysql.cj.jdbc.Driver
  cloud:
    compatibility-verifier:
      enabled: false   # SC 2023.0.3 校验器不认 Boot 3.4.5（SCA 矩阵允许），见 AGENTS.md 已知陷阱
    nacos:
      discovery:
        enabled: false
        server-addr: localhost:8848
  # nodule 无 Redis 依赖，排除 Redisson 自动装配避免启动失败（specs/modules/nodule.md §7）
  autoconfigure:
    exclude:
      - org.redisson.spring.starter.RedissonAutoConfigurationV2
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

knife4j:
  enable: true

logging:
  level:
    com.yiliao: INFO
