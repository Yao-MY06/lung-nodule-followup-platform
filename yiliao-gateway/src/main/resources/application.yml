server:
  port: 8080

spring:
  application:
    name: yiliao-gateway
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    nacos:
      discovery:
        # 本地开发默认关闭，路由走静态 uri；启用注册中心后可改 lb://yiliao-xxx
        enabled: false
        server-addr: localhost:8848
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"     # 生产收紧为前端域名
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
      routes:
        - id: auth
          uri: http://localhost:8081
          predicates: [ "Path=/api/auth/**" ]
        - id: patient
          uri: http://localhost:8082
          predicates: [ "Path=/api/patient/**" ]
        - id: nodule
          uri: http://localhost:8083
          predicates: [ "Path=/api/nodule/**,/api/exam/**" ]
        - id: followup
          uri: http://localhost:8084
          predicates: [ "Path=/api/followup/**" ]
        - id: notification
          uri: http://localhost:8085
          predicates: [ "Path=/api/notify/**" ]
        - id: ai
          uri: http://localhost:8086
          predicates: [ "Path=/api/ai/**" ]
        - id: statistics
          uri: http://localhost:8087
          predicates: [ "Path=/api/stats/**" ]
        - id: file
          uri: http://localhost:8088
          predicates: [ "Path=/api/file/**" ]
    # Sentinel 服务治理（P5）：仅注册限流/熔断能力，默认不依赖控制台
    # 控制台未启动不影响网关运行：eager=false 不在启动期主动连控制台；
    # transport.dashboard 未配置（保持注释）时客户端不外连，网关路由与鉴权照常工作
    sentinel:
      eager: false   # 懒加载：首次请求才初始化 Sentinel，避免无控制台环境启动报错/阻塞
      transport:
        # 启用控制台方式：① docker/docker-compose.yml 文末取消 sentinel-dashboard 注释（端口 8858）并 up -d
        #               ② 取消下行注释重启网关，控制台 localhost:8858 即可看到 yiliao-gateway
        # dashboard: localhost:8858
        port: 8719   # Sentinel 客户端与控制台的通信端口（默认 8719，被占用时自动 +1 递增，无需改动）

yiliao:
  jwt:
    # 必须与 yiliao-auth 一致；生产由 Nacos 下发（specs/global/10 §5）
    secret: dev-only-secret-please-override-via-nacos-0123456789abcdef
    issuer: yiliao
    access-ttl-seconds: 7200
    refresh-ttl-seconds: 604800

logging:
  level:
    com.yiliao: INFO
