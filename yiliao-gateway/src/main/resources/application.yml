server:
  port: 8080

spring:
  application:
    name: yiliao-gateway
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    nacos:
      discovery:
        # 本地开发默认关闭，路由走静态 uri；启用注册中心后可改 lb://yiliao-xxx
        enabled: false
        server-addr: localhost:8848
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"     # 生产收紧为前端域名
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
      routes:
        - id: auth
          uri: http://localhost:8081
          predicates: [ "Path=/api/auth/**" ]
        - id: patient
          uri: http://localhost:8082
          predicates: [ "Path=/api/patient/**" ]
        - id: nodule
          uri: http://localhost:8083
          predicates: [ "Path=/api/nodule/**,/api/exam/**" ]
        - id: followup
          uri: http://localhost:8084
          predicates: [ "Path=/api/followup/**" ]
        - id: notification
          uri: http://localhost:8085
          predicates: [ "Path=/api/notify/**" ]
        - id: ai
          uri: http://localhost:8086
          predicates: [ "Path=/api/ai/**" ]
        - id: statistics
          uri: http://localhost:8087
          predicates: [ "Path=/api/stats/**" ]
        - id: file
          uri: http://localhost:8088
          predicates: [ "Path=/api/file/**" ]

yiliao:
  jwt:
    # 必须与 yiliao-auth 一致；生产由 Nacos 下发（specs/global/10 §5）
    secret: dev-only-secret-please-override-via-nacos-0123456789abcdef
    issuer: yiliao
    access-ttl-seconds: 7200
    refresh-ttl-seconds: 604800

logging:
  level:
    com.yiliao: INFO
