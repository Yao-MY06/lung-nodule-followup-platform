# RocketMQ broker 配置（开发环境，P0）
brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH
# 开发环境自动建主题；生产禁止
autoCreateTopicEnable = true
# 宿主机访问地址：容器内 broker 向 namesrv 注册的必须是宿主机可达 IP
brokerIP1 = host.docker.internal
