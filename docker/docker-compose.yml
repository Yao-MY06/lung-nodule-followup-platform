# 肺结节/肺癌患者管理系统 - 本地中间件编排（P0）
# 用法：docker compose up -d
# 应用服务本地 IDE 启动；xxl-job/seata/sentinel 按阶段启用（见文末注释块）
name: yiliao

services:
  mysql:
    image: mysql:8.0
    container_name: yiliao-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: yiliao123
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init-sql:/docker-entrypoint-initdb.d:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pyiliao123"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: yiliao-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: yiliao-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"   # 开发期关闭鉴权；联调网关后按需开启
      TZ: Asia/Shanghai
    ports:
      - "8848:8848"
      - "9848:9848"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 10

  rocketmq-namesrv:
    image: apache/rocketmq:5.2.0
    container_name: yiliao-rmq-namesrv
    restart: unless-stopped
    command: sh mqnamesrv
    ports:
      - "9876:9876"

  rocketmq-broker:
    image: apache/rocketmq:5.2.0
    container_name: yiliao-rmq-broker
    restart: unless-stopped
    depends_on:
      - rocketmq-namesrv
    command: sh mqbroker -n rocketmq-namesrv:9876 -c /home/rocketmq/conf/broker.conf
    ports:
      - "10911:10911"
      - "18081:8081"  # proxy 端口预留（宿主机 8081 被 auth-service 占用，改映射 18081）
    volumes:
      - ./rocketmq/broker.conf:/home/rocketmq/conf/broker.conf:ro
      - rmq-broker-logs:/home/rocketmq/logs
      - rmq-broker-store:/home/rocketmq/store

  minio:
    image: minio/minio:latest
    container_name: yiliao-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: yiliao
      MINIO_ROOT_PASSWORD: yiliao123456
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # 控制台
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
  redis-data:
  minio-data:
  rmq-broker-logs:
  rmq-broker-store:

# ── 按阶段启用（先以注释形式登记，避免 P0 拉起全家桶）────────────────────
# xxl-job-admin（P3）：需先导入 xxl_job 库表结构，宿主端口用 8280 避让 gateway 8080
#   image: xuxueli/xxl-job-admin:2.4.1
#   ports: "8280:8080"
#   environment:
#     PARAMS: --spring.datasource.url=jdbc:mysql://mysql:3306/xxl_job?... --spring.datasource.username=root --spring.datasource.password=yiliao123
#
# seata-server（P4，建档链路）：TC 独立部署，file 存储起步
#   image: apache/seata-server:2.1.0
#   ports: "7091:7091" "8091:8091"
#
# sentinel-dashboard（P1+ 可选，限流规则控制台）：
#   image: bladex/sentinel-dashboard:latest
#   ports: "8858:8858"
