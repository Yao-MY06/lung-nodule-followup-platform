server:
  port: 8081

spring:
  application:
    name: yiliao-auth
  datasource:
    url: jdbc:mysql://localhost:3306/yiliao_auth?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: yiliao123
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    nacos:
      discovery:
        # 本地开发默认关闭（无 Nacos 时直连）；启用注册中心时改 true
        enabled: false
        server-addr: localhost:8848
  # Redisson 暂不启用（P2 分布式锁时开启），避免无 Redis 时启动失败
  autoconfigure:
    exclude:
      - org.redisson.spring.starter.RedissonAutoConfiguration

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

yiliao:
  jwt:
    # 开发占位密钥；生产必须由 Nacos/环境变量覆盖（specs/modules/auth.md §6.3）
    secret: dev-only-secret-please-override-via-nacos-0123456789abcdef
    issuer: yiliao
    access-ttl-seconds: 7200      # 2h（specs/global/10 §5）
    refresh-ttl-seconds: 604800   # 7d

knife4j:
  enable: true

logging:
  level:
    com.yiliao: INFO
